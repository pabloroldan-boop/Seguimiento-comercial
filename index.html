<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}

<title>Seguimiento Comercial Zuppa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Tema claro fijo. Layout: barra superior fija con marca, vistas y filtros globales; cada vista abre con resumen (KPIs) y baja al detalle. Paleta tomada de los tableros Power BI de Zuppa. */
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface-2:#f5f7fc; --line:#dde2ee;
  --ink:#0e1b4d; --text:#26304f; --muted:#66708c;
  --navy:#16297a; --cer:#0f7a72; --ung:#2c55c9; --acc:#e2702f;
  --c3:#5aa7c9; --c4:#8a3f6b; --c5:#c99a2e; --c6:#8b93a8;
  --good:#1d8a4b; --bad:#c43a2f; --warn:#c98a12;
  --good-bg:#e5f4ea; --bad-bg:#fbe7e5; --warn-bg:#fbf1dc;
  color-scheme:light;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:58px;width:auto;display:block;flex:none}
.brand span{border-left:1px solid var(--line);padding-left:12px;line-height:1.25}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:24px;letter-spacing:.04em;color:var(--ink)}
.brand span{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:7px 11px;border-radius:6px}
nav.tabs a:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{color:#fff;background:var(--navy)}
nav.tabs a .new{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-left:4px}
nav.tabs a[aria-current="page"] .new{color:inherit;opacity:.8}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding-block:0 10px;align-items:end}
.cal>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.filters select{font:inherit;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:120px}
.filters button{font:inherit;font-size:13px;font-weight:600;color:var(--navy);background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.cal{position:relative}
.cal-btn{font:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:200px;text-align:left}
.cal-btn svg{flex:none;color:var(--navy)}
.cal-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(14,27,77,.16);padding:14px;width:300px;max-width:calc(100vw - 32px)}
.cal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.cal-head b{font-family:var(--f-disp);font-size:18px;color:var(--ink)}
.cal-head span{font-size:12px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dw{font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cal-grid button{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;border:0;background:none;color:var(--ink);height:34px;border-radius:6px;cursor:pointer}
.cal-grid button:hover:not(:disabled){background:var(--surface-2)}
.cal-grid button:disabled{color:var(--line);cursor:default}
.cal-grid button.in{background:color-mix(in srgb,var(--navy) 12%,transparent);border-radius:0}
.cal-grid button.edge,.cal-grid button.edge:hover:not(:disabled){background:var(--navy);color:#fff;border-radius:6px;font-weight:600}
.cal-grid button.pend{outline:2px solid var(--acc);outline-offset:-2px}
.cal-pre{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.cal-pre button{font:inherit;font-size:12px;font-weight:600;color:var(--navy);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.cal-hint{font-size:11px;color:var(--muted);margin-top:8px}
.filters .stamp{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding-block:20px 48px}
.view{display:grid;gap:16px}
.vh{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh h1{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1.05;margin:0;color:var(--ink);letter-spacing:.01em;text-wrap:balance}
.vh p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.note{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.mut{background:var(--surface-2);color:var(--muted)}
.grid{display:grid;gap:16px}
.k5{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:980px){.g21{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:12px}
.kpi .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-disp);font-weight:700;font-size:40px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .val small{font-size:20px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.kpi.cer .val{color:var(--cer)} .kpi.ung .val{color:var(--ung)}
.pace .track{position:relative;height:14px;background:var(--surface-2);border-radius:7px;margin:14px 0 6px;border:1px solid var(--line)}
.pace .fill{position:absolute;inset:0 auto 0 0;border-radius:6px}
.pace .proj{position:absolute;top:0;bottom:0;border-radius:0 6px 6px 0;opacity:.28}
.pace .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.pace .tick span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:var(--muted)}
.pace .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pace dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 0}
@media (max-width:520px){.pace dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pace dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pace dd{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pace p{margin:10px 0 0;font-size:13px}
.chart{position:relative;height:280px}
.chart.tall{height:360px} .chart.short{height:220px}
.tw{overflow:auto;max-height:440px;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:600;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
thead th[aria-sort="descending"]::after{content:" ▾"} thead th[aria-sort="ascending"]::after{content:" ▴"}
tbody tr:nth-child(even){background:var(--surface-2)}
tbody tr:hover{background:color-mix(in srgb,var(--navy) 8%,transparent)}
tfoot td{font-weight:700;color:var(--ink);border-top:2px solid var(--ink);position:sticky;bottom:0;background:var(--surface)}
td.neg{color:var(--bad);font-weight:600} td.pos{color:var(--good)}
td .bar-in{display:inline-block;height:6px;border-radius:3px;background:var(--navy);vertical-align:middle;margin-right:6px;opacity:.75}
.search{font:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;width:100%;max-width:260px;margin-bottom:8px}
.ins{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.ins li p{margin:0;max-width:80ch}
.ins li b{color:var(--ink)}
.sev{width:9px;height:9px;border-radius:50%;margin-top:6px}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.good{background:var(--good)} .sev.info{background:var(--navy)}
.exe .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.exe .val{font-size:36px}
.exe .sub b{color:var(--ink)}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.k4{grid-template-columns:minmax(0,1fr)}}
.cobsel{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:8px}
.cobsel label{display:flex;flex-direction:column;gap:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.cobsel select{font:inherit;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
@media (max-width:980px){.k3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.k3{grid-template-columns:minmax(0,1fr)}}
.titular{font-size:16px;color:var(--text);max-width:85ch;margin:6px 0 0;line-height:1.5}
.titular b{color:var(--ink)}
.fechada{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:2px;border-radius:0;vertical-align:3px;width:14px}
.legend i.dash{height:0;border-top:2px dashed;background:none!important;vertical-align:3px;width:14px}
.yoy td:first-child{font-weight:600;color:var(--ink);white-space:normal;min-width:140px}
.yoy td.note{white-space:normal}
.tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);font-weight:700}
@media (max-width:640px){header.top{position:static}.bar{flex-direction:column;align-items:stretch;gap:8px}nav.tabs{flex:none;width:100%;max-width:100%}.filters label{flex:1 1 140px}.filters select{width:100%;min-width:0}.kpi .val{font-size:30px}.vh h1{font-size:24px}.filters .stamp{margin-left:0;text-align:left}.cal{flex:1 1 100%}.cal-btn{width:100%;min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* Carga de datos: el link trae ?api=<servicio de Apps Script>&k=<llave> */
function avisoError(titulo, detalle){
  if (window.__avisoMostrado) return; window.__avisoMostrado = true;
  const el=document.getElementById('main');
  el.innerHTML='<div class="card" style="max-width:720px;margin-top:8px"><h2></h2><p style="margin:0 0 8px"></p><p class="note" style="margin:0">Si el problema sigue, mandá una captura de este mensaje.</p></div>';
  el.querySelector('h2').textContent=titulo; el.querySelector('p').textContent=detalle;
}
(function(){
  // Dirección del servicio de datos (Apps Script). Si alguna vez cambia, se reemplaza acá o se pasa con ?api=
  const API_DEF='https://script.google.com/macros/s/AKfycbw_rWLbYPKEEe7grVSIZfZApiR_Gzv9Ra2y36QSQXmFoHzPu9uqloUq0wpE8Q1E5EUAzw/exec';
  const q=new URLSearchParams(location.search), api=q.get('api')||API_DEF;
  const ls={get:n=>{try{return localStorage.getItem(n)}catch(e){return null}}, set:(n,v)=>{try{localStorage.setItem(n,v)}catch(e){}}, del:n=>{try{localStorage.removeItem(n)}catch(e){}}};
  let k=q.get('k');
  if(k) ls.set('zuppa-llave',k); else k=ls.get('zuppa-llave');
  if(!k){ avisoError('Falta la llave del tablero','Abrí el tablero con el link completo que se genera desde la planilla (menú Tablero Zuppa → 3. Generar link del tablero). Después de la primera vez, este navegador la recuerda.'); return; }
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(api)){ avisoError('El link no es válido','La dirección del servicio de datos tiene que ser la de la aplicación web de Apps Script (termina en /exec).'); return; }

  // Datos guardados de la última visita: el tablero abre al instante y después busca los nuevos.
  let guardado=null;
  try{ const g=JSON.parse(ls.get('zuppa-datos')||'null'); if(g&&g.k===k&&g.d) guardado=g.d; }catch(e){}
  const arrancar=()=>{ const correr=()=>{ const app=document.createElement('script'); app.textContent=document.getElementById('app').textContent; document.body.appendChild(app); }; if(document.getElementById('app')) correr(); else document.addEventListener('DOMContentLoaded', correr); };
  const nota=t=>{ const st=document.getElementById('stamp'); if(!st) return; let n=document.getElementById('nota-datos'); if(!n){ n=document.createElement('div'); n.id='nota-datos'; st.appendChild(n); } n.textContent=t; if(!t) n.remove(); };
  if(guardado){ window.DATA=JSON.parse(guardado); arrancar(); nota('Buscando datos nuevos…'); }
  else document.getElementById('main').innerHTML='<p class="note">Cargando datos… La primera vez puede tardar unos segundos.</p>';

  window.DATA=guardado? window.DATA : undefined;
  const previo=window.DATA;
  const s=document.createElement('script');
  s.src=api+(api.indexOf('?')<0?'?':'&')+'k='+encodeURIComponent(k)+'&t='+Date.now();

const X = window.DATA;

const MC = X.mes, YR = X.anio, YA = X.anio-1, MCN = MESL[MC-1], mcn = MCN.toLowerCase();   // mes en curso
const CER = MC-1;                                                                        // meses cerrados del año

const feriadosTxt = X.feriados && X.feriados.length? `sin los feriados del ${X.feriados.join(' y ')}` : 'sin feriados';

/* ---------- formato ---------- */
const nf = d => new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const chip = (x,good=true,d=1,suffix='') => { if(!isFinite(x)) return '<span class="chip mut">–</span>'; const up=x>=0; const ok = good? up : !up; return `<span class="chip ${ok?'good':'bad'}">${up?'▲':'▼'} ${N(Math.abs(x*100),d)}%${suffix}</span>`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- estado y filtros ---------- */
const st = {un:-1, ca:-1, de:-1, d1:DIAS[0], d2:CORTE, view:'ejecutivo'};

  for(let i=0;i<off;i++) h+='<span></span>';
  for(let d=1; d<=last; d++){ const ok=DIAS.includes(d); const lo=cal.pend??st.d1, hi=cal.pend??st.d2;
    const cls = cal.pend===d? 'edge pend' : (!cal.pend && (d===st.d1||d===st.d2))? 'edge' : (!cal.pend && d>lo && d<hi)? 'in' : '';

function calSet(a,b){ st.d1=Math.min(a,b); st.d2=Math.max(a,b); cal.pend=null; calText(); calClose(); render(); }

for (const [el,k] of [[fUn,'un'],[fCa,'ca'],[fDe,'de']]) el.addEventListener('change',()=>{ st[k]=+el.value; render(); });
fReset.onclick = ()=>{ Object.assign(st,{un:-1,ca:-1,de:-1,d1:DIAS[0],d2:CORTE}); fUn.value=fCa.value=fDe.value=-1; calText(); render(); };

// D: día, cliente, canal, un, depto, transporte, hl, final
// P: día, cliente, producto, canal, un, depto, hl, pnsf, neto, ts
// M: año, mes, un, canal, hl, neto, final
const fD = (o={}) => { const s={...st,...o}; return X.D.filter(r=>(s.un<0||r[3]===s.un)&&(s.ca<0||r[2]===s.ca)&&(s.de<0||r[4]===s.de)&&r[0]>=s.d1&&r[0]<=s.d2); };
const fP = (o={}) => { const s={...st,...o}; return X.P.filter(r=>(s.un<0||r[4]===s.un)&&(s.ca<0||r[3]===s.ca)&&(s.de<0||r[5]===s.de)&&r[0]>=s.d1&&r[0]<=s.d2); };
const fM = (o={}) => { const s={...st,...o}; return X.M.filter(r=>(s.un<0||r[2]===s.un)&&(s.ca<0||r[3]===s.ca)); };
function grp(rows, key, idx){ const m=new Map(); for(const r of rows){ const k=key(r); let a=m.get(k); if(!a){a=new Array(idx.length).fill(0); a.n=0; m.set(k,a);} for(let i=0;i<idx.length;i++) a[i]+=r[idx[i]]; a.n++; } return m; }

/* ---------- gráficos ---------- */

function table(host, cols, rows, {foot, sort=1, dir=-1, limit, search}={}){

    if(limit) r=r.slice(0,limit);

/* ---------- métricas comunes ---------- */
function pace(u){
  // ritmo contra objetivo: todo el mes a la fecha, respeta canal y departamento
  const rows = X.D.filter(r=>r[3]===u&&(st.ca<0||r[2]===st.ca)&&(st.de<0||r[4]===st.de));

}
function paceCard(u){

   <div class="track" role="img" aria-label="Avance ${PCT(p.alc,1)} con ${PCT(p.tiempo,0)} del mes transcurrido">

}
function rentab(rows){ const pn=sum(rows,7), ne=sum(rows,8), ts=sum(rows,9), hl=sum(rows,6); return {pn,ne,ts,hl,mb:ne-pn,pmb:(ne-pn)/ne,ppn:pn/ne,mts:ne+ts-pn,pmts:(ne+ts-pn)/(ne+ts),ph:ne/hl}; }

const rentCols = (first) => [{t:first,l:1},{t:'$ Neto',f:v=>MM(v)},{t:'HL',f:v=>N(v)},{t:'$ Neto/HL',f:v=>PH(v)},{t:'% Margen',f:v=>PCT(v,0),sign:1},{t:'TS',f:v=>MM(v,2)},{t:'% MG + TS',f:v=>PCT(v,0),sign:1}];

function monthAgg(rows){ const m=grp(rows,r=>r[0]*100+r[1],[4,5,6]); return k=>m.get(k)||[0,0,0]; }

/* ---------- lectura del analista (texto escrito a mano: se actualiza junto con esta fecha) ---------- */
const LECTURA_FECHA = '13/11/2026';

/* ---------- vistas ---------- */
const V = {};

V.ejecutivo = () => {

  // semáforos

  const sMg = x => x>=REF_MG_TS ? ['good','En referencia'] : x>=REF_MG_TS-.02 ? ['warn','Algo debajo'] : ['bad','Debajo de referencia'];
  const sYoy = x => temprano ? ['mut','Preliminar'] : x>=0 ? ['good','Crece'] : x>=-.05 ? ['warn','Cae levemente'] : ['bad','Cae'];
  const card = (lab, val, est, sub1, sub2) => `<div class="card kpi exe"><div class="top"><div class="lab">${lab}</div><span class="chip ${est[0]}">${est[1]}</span></div><div class="val">${val}</div><div class="sub">${sub1}</div>${sub2?`<div class="sub">${sub2}</div>`:''}</div>`;
  const tarjetas = [
    card('Cerveza · volumen', PCT(p0.alc,0), sVol(p0), `<b>${N(p0.real)}</b> de ${N(p0.obj)} HL · mes transcurrido ${PCT(p0.tiempo,0)}`, `Cierre proyectado ${N(p0.proy)} HL (${PCT(p0.alcProy,0)})`),
    card('UNG · volumen', PCT(p1.alc,0), sVol(p1), `<b>${N(p1.real)}</b> de ${N(p1.obj)} HL · mes transcurrido ${PCT(p1.tiempo,0)}`, `Cierre proyectado ${N(p1.proy)} HL (${PCT(p1.alcProy,0)})`),
    card('Cerveza · precio final', `${N(pc/1000)}<small>mil/HL</small>`, sPre(pc/mc), `Mínimo $${N(X.minimos.cer)} mil · ${SPCT(pc/mc-1,1)}`, isFinite(pc)&&pc<mc ? `Brecha del mes: <b>${MM((mc-pc)*hlU(0),1)}</b>` : ''),
    card('UNG · precio final', `${N(pu/1000)}<small>mil/HL</small>`, sPre(pu/mu), `Mínimo $${N(X.minimos.ung)} mil · ${SPCT(pu/mu-1,1)}`, isFinite(pu)&&pu<mu ? `Brecha del mes: <b>${MM((mu-pu)*hlU(1),1)}</b>` : ''),
    card('Margen + trade spend', PCT(r.pmts,1), sMg(r.pmts), `Resultado <b>${MM(r.mts,1)}</b> · referencia ${PCT(REF_MG_TS,0)}`, `Sin TS el margen bruto es ${PCT(r.pmb,1)}`),
    card(`Volumen vs ${MES[MC-1]} ${YA}`, SPCT(vy,0), sYoy(vy), `Proyección ${N(oc[0]*fac)} HL contra ${N(ol[0])} HL`, 'Todas las unidades de negocio'),
  ];
  const cb = cobDatos();
  if (cb) {
    const sCli = COB.prevDia!=null && !cb.filtrado ? (x => x>=1?['good','Más que el mes anterior']:x>=.95?['warn','Parecido al mes anterior']:['bad','Menos que el mes anterior'])(cb.comp/COB.prevDia) : ['mut','Sin dato al mismo día'];
    tarjetas.push(
      card('Clientes con compra', N(cb.comp), sCli, `${cb.antNom} completo: <b>${N(cb.prevFull)}</b> · ${PCT(cb.comp/cb.prevFull,0)} alcanzado`, `${MES[MC-1]} ${YA} completo: ${N(cb.lyFull)} · mes transcurrido ${PCT(HAB_TRANS/HAB.length,0)}`),
      card('Cobertura de cartera', PCT(cb.cob,0), ['mut','Informativo'], `<b>${N(cb.sin)}</b> clientes activos sin compra`, `Cartera activa ${N(cb.base)} clientes`));
  }

  // titular automático
  const rojos = [sVol(p0),sVol(p1),sPre(pc/mc),sPre(pu/mu),sMg(r.pmts),sYoy(vy)].filter(e => e[0]==='bad').length;
  const titular = `Al <b>${X.corte}</b>, con ${PCT(p0.tiempo,0)} del mes transcurrido, Cerveza lleva <b>${PCT(p0.alc,0)}</b> del objetivo y UNG <b>${PCT(p1.alc,0)}</b>. ` +
    (rojos ? `<b>${rojos} de 6 indicadores</b> están en rojo.` : 'Ningún indicador está en rojo.') +
    (temprano ? ' Con tan pocos días, las proyecciones todavía son preliminares.' : '');

  // alertas automáticas
  const al = [];
  if (isFinite(pc) && pc < mc) al.push({sev:pc/mc<.95?'bad':'warn', w:(mc-pc)*hlU(0), t:`<b>Cerveza se factura ${PCT(1-pc/mc,1)} debajo del mínimo.</b> Promedio de $${N(pc/1000)} mil/HL contra $${N(X.minimos.cer)} mil: la brecha acumulada es de ${MM((mc-pc)*hlU(0),1)}.`});
  if (isFinite(pu) && pu < mu) al.push({sev:pu/mu<.95?'bad':'warn', w:(mu-pu)*hlU(1), t:`<b>UNG se factura ${PCT(1-pu/mu,1)} debajo del mínimo.</b> Promedio de $${N(pu/1000)} mil/HL contra $${N(X.minimos.ung)} mil: la brecha acumulada es de ${MM((mu-pu)*hlU(1),1)}.`});
  const ult = d.filter(x => x[0]===CORTE), cortes = grp(ult.filter(x => x[3]<=1), x => x[3]*10+x[2], [6,7]);
  [...cortes].map(([k,a]) => ({u:Math.floor(k/10), c:k%10, hl:a[0], ph:a[1]/a[0]})).filter(o => o.hl>=20 && o.ph < 0.99*(o.u===0?mc:mu))
    .sort((a,b) => (a.ph/(a.u===0?mc:mu)) - (b.ph/(b.u===0?mc:mu))).slice(0,2)
    .forEach(o => al.push({sev:'warn', w:0, t:`<b>El ${diaLbl(CORTE)}, ${o.u===0?'Cerveza':'UNG'} en ${CANAL_NOMBRE[CA[o.c]]} salió a $${N(o.ph/1000)} mil/HL.</b> Fueron ${N(o.hl)} HL, ${PCT(1-o.ph/(o.u===0?mc:mu),0)} debajo del mínimo.`}));
  if (!temprano) [[p0,'Cerveza'],[p1,'UNG']].forEach(([p,n]) => { if (p.req > p.prom*1.2) al.push({sev:'bad', w:0, t:`<b>${n} necesita ${N(p.req)} HL por día hábil para cumplir.</b> Es ${N(p.req/p.prom,1)} veces su promedio del mes (${N(p.prom)} HL).`}); });
  const prodRes = [...grp(fP(mes), x => x[2], [7,8,9])].map(([k,a]) => [X.prods[k], a[1]+a[2]-a[0]]).filter(x => x[1] < 0).sort((a,b) => a[1]-b[1]);
  const pNeg = prodRes.reduce((s,x) => s+x[1], 0);
  if (pNeg < -1e6) al.push({sev:'warn', w:-pNeg, t:`<b>${prodRes.length} productos pierden plata aun con trade spend: ${MM(pNeg,1)}.</b> El que más pierde es ${esc(prodRes[0][0])} (${MM(prodRes[0][1],1)}).`});
  const cliRes = [...grp(fP(mes), x => x[1], [7,8,9])].map(([k,a]) => a[1]+a[2]-a[0]).filter(v => v < 0);
  const cNeg = cliRes.reduce((s,v) => s+v, 0);
  if (cliRes.length) al.push({sev:'info', w:0, t:`<b>${N(cliRes.length)} clientes con resultado negativo aun con trade spend.</b> Suman ${MM(cNeg,1)}${-cNeg < Math.abs(pNeg) ? ': el problema de margen está más en productos que en clientes.' : '.'}`});
  if (cb && cb.sin) {
    const pv = [...grp(cb.filas.filter(f => !f[5] && f[3]!=='Sin dato').flatMap(f => String(f[3]).split(' / ').map(v => [v])), f => f[0], [])].map(([k,a]) => [k, a.n]).sort((a,b) => b[1]-a[1]).slice(0,3);
    al.push({sev: HAB_TRANS>=HAB.length/2 ? 'warn' : 'info', w:0, t:`<b>${N(cb.sin)} clientes activos todavía no compraron este mes.</b>${pv.length ? ` Los vendedores con más pendientes: ${pv.map(([k,n]) => `${esc(k)} (${N(n)})`).join(', ')}.` : ''}`});
  }
  if (r.pmb < 0) al.push({sev:'info', w:0, t:`<b>El trade spend sostiene el resultado.</b> Sin él, el margen bruto es ${PCT(r.pmb,1)}; el TS equivale al ${PCT(r.ts/r.ne,1)} de la venta neta.`});
  const orden = {bad:0, warn:1, info:2};
  const alertas = al.sort((a,b) => orden[a.sev]-orden[b.sev] || b.w-a.w).slice(0,6);

  setTimeout(() => { const o = baseOpts(); [0,1].forEach(u => {
    const p = u===0?p0:p1, col = css(u===0?'--cer':'--ung');
    const rows = X.D.filter(x => x[3]===u && (st.ca<0||x[2]===st.ca) && (st.de<0||x[4]===st.de));
    const porDia = grp(rows, x => x[0], [6]);
    let acum = 0; const real = [], ult = HAB.filter(h => h<=CORTE).length-1;
    HAB.forEach(h => { for (const [dd,a] of porDia) if (dd<=h && dd>(HAB[HAB.indexOf(h)-1]||0)) acum += a[0]; real.push(h<=CORTE ? acum : null); });
    const proy = HAB.map((h,i) => (temprano || i<ult) ? null : real[ult] + p.prom*(i-ult));
    const obj = HAB.map((h,i) => p.obj*(i+1)/HAB.length);
    mk('cEx'+u, {type:'line', data:{labels:HAB.map(h => h+'/'+MC), datasets:[
      {label:'Real acumulado', data:real, borderColor:col, backgroundColor:col, borderWidth:2.5, pointRadius:real.map((v,i) => i===ult?5:0), spanGaps:false},
      {label:'Proyección', data:proy, borderColor:col, borderDash:[2,4], borderWidth:2, pointRadius:0},
      {label:'Ritmo para cumplir', data:obj, borderColor:css('--muted'), borderDash:[6,4], borderWidth:1.5, pointRadius:0}]},
      options:{...o, scales:{...o.scales, x:{...o.scales.x, ticks:{color:css('--muted'), maxRotation:0, autoSkip:true, maxTicksLimit:8}}, y:{...o.scales.y, beginAtZero:true, title:{display:true, text:'HL acumulados'}}},
        plugins:{...o.plugins, tooltip:{...o.plugins.tooltip, filter:c => c.raw!=null, callbacks:{label:c => `${c.dataset.label}: ${N(c.raw)} HL`}}}}});
  }); });

  const leyenda = col => `<div class="legend"><span><i class="ln" style="background:${col}"></i>Real acumulado</span>${temprano?'':`<span><i class="dash" style="border-color:${col}"></i>Proyección al ritmo actual</span>`}<span><i class="dash" style="border-color:var(--muted)"></i>Ritmo para cumplir el objetivo</span></div>`;
  return `<div class="vh"><div><h1>Panorama ejecutivo · ${mcn} ${YR}</h1><p class="titular">${titular}</p></div></div>
  <div class="grid ${tarjetas.length>6?'k4':'k3'}">${tarjetas.join('')}</div>
  <div class="grid g2">
   <div class="card"><h2>Cerveza · ritmo del mes <small>objetivo ${N(p0.obj)} HL</small></h2>${leyenda('var(--cer)')}<div class="chart short"><canvas id="cEx0" role="img" aria-label="Cerveza: HL acumulados contra el ritmo para cumplir el objetivo"></canvas></div></div>
   <div class="card"><h2>UNG · ritmo del mes <small>objetivo ${N(p1.obj)} HL</small></h2>${leyenda('var(--ung)')}<div class="chart short"><canvas id="cEx1" role="img" aria-label="UNG: HL acumulados contra el ritmo para cumplir el objetivo"></canvas></div></div>
  </div>
  <div class="grid g2">
   <div class="card"><h2>Alertas del día <small>se calculan solas con cada actualización</small></h2><ul class="ins">${alertas.length ? alertas.map(a => `<li><span class="sev ${a.sev}"></span><p>${a.t}</p></li>`).join('') : '<li><span class="sev good"></span><p>Sin alertas: precio, ritmo y margen dentro de lo esperado.</p></li>'}</ul></div>
   <div class="card"><h2>Lectura del analista <small>escrita a mano al ${LECTURA_FECHA}</small></h2><ul class="ins">${LECTURA}</ul></div>
  </div>
  ${(st.un>=0) ? '<p class="note">La vista ejecutiva muestra siempre las dos unidades: el filtro de unidad de negocio no se aplica acá.</p>' : ''}
  <p class="note">Semáforos: volumen según el cierre proyectado contra el objetivo (verde ≥ 100%, amarillo ≥ 90%); precio contra el mínimo (amarillo hasta 5% debajo); margen + TS contra una referencia de ${PCT(REF_MG_TS,0)}; volumen contra el mismo mes de ${YA} proyectado a fin de mes.</p>`;
};

V.cobertura = () => {
  const cb = cobDatos();
  if (!cb) return `<div class="vh"><div><h1>Clientes y cobertura</h1><p>Esta vista necesita las pestañas "Clientes activos" (la lista de clientes) y "Compras por cliente" en el Excel.</p></div></div>`;
  // un cliente compartido trae sus vendedores separados por " / ": cuenta en la cartera de cada uno
  const vendsDe = f => String(f[3]).split(' / ');
  const ven = [...new Set(cb.filas.filter(f => !f[5]).flatMap(vendsDe))].sort((a,b) => a.localeCompare(b));
  const soloSinCompra = !cb.filas.some(f => f[5] && f[3]!=='Sin dato');
  const compartidos = cb.filas.filter(f => vendsDe(f).length > 1).length;
  if (st.cobVen && !ven.includes(st.cobVen)) st.cobVen = '';
  const cuenta = (key) => { const m = new Map(); cb.filas.forEach(f => { const k = f[key]; const a = m.get(k) || [0,0]; a[0]++; a[1] += f[5]; m.set(k,a); }); return [...m].map(([k,a]) => [k, a[0], a[1], a[0]-a[1], a[1]/a[0]]); };
  const cols = n => [{t:n,l:1},{t:'Cartera',f:v=>N(v)},{t:'Con compra',f:v=>N(v)},{t:'Sin compra',f:v=>N(v)},{t:'Cobertura',f:v=>PCT(v,0)}];
  const pie = ['Total', cb.base, cb.comp, cb.sin, cb.cob];
  const unOrden = UN.filter(u => COB.porUN[u]).map(u => [u, COB.porUN[u]]);
  const listaVen = [...grp(cb.filas.filter(f => !f[5]).flatMap(f => vendsDe(f).map(v => [v])), f => f[0], [])].map(([k,a]) => [k, a.n, a.n/cb.sin]);
  const cobVen = () => { const m = new Map(); cb.filas.forEach(f => vendsDe(f).forEach(k => { const a = m.get(k) || [0,0]; a[0]++; a[1] += f[5]; m.set(k,a); })); return [...m].map(([k,a]) => [k, a[0], a[1], a[0]-a[1], a[1]/a[0]]); };
  setTimeout(() => {
    const o = baseOpts();
    const datos = [['Cualquier unidad', cb.comp]].concat(st.ca<0 && st.de<0 ? unOrden : []);
    mk('cCobUN', {type:'bar', data:{labels:datos.map(d => d[0]==='Cualquier unidad'?d[0]:UNS[UN.indexOf(d[0])]), datasets:[{data:datos.map(d => d[1]), backgroundColor:datos.map((d,i) => i===0?css('--navy'):unColor(UN.indexOf(d[0]))), borderRadius:3, maxBarThickness:24}]},
      options:{...o, indexAxis:'y', interaction:{mode:'nearest',intersect:true}, layout:{padding:{right:110}}, scales:{x:{display:false, max:cb.base}, y:{grid:{display:false}, border:{display:false}, ticks:{color:css('--text')}}},
        plugins:{...o.plugins, vl:{fmt:v => `${N(v)} · ${PCT(v/cb.base,0)}`}, tooltip:{...o.plugins.tooltip, callbacks:{label:c => `${N(c.raw)} clientes · ${PCT(c.raw/cb.base,1)} de la cartera`}}}}});
    const ms = [...Array(MC)].map((_,i) => i+1);
    mk('cCobMes', {type:'line', data:{labels:ms.map(m => MES[m-1]), datasets:[
      {label:String(YR), data:ms.map(m => X.CCC[YR+'-'+m]??null), borderColor:css('--navy'), backgroundColor:css('--navy'), borderWidth:2, pointRadius:ms.map(m => m===MC?5:3)},
      {label:String(YA), data:ms.map(m => X.CCC[YA+'-'+m]??null), borderColor:css('--c6'), backgroundColor:css('--c6'), borderWidth:2, borderDash:[2,3], pointRadius:3}]},
      options:{...o, plugins:{...o.plugins, tooltip:{...o.plugins.tooltip, callbacks:{label:c => `${c.dataset.label}: ${N(c.raw)} clientes${c.dataIndex===MC-1&&c.datasetIndex===0?' (a la fecha)':''}`}}}}});
    table(document.getElementById('tCobCanal'), cols('Canal'), cuenta(1).map(r => [CANAL_NOMBRE[r[0]]||r[0]].concat(r.slice(1))), {sort:1, foot:pie});
    table(document.getElementById('tCobDep'), cols('Departamento'), cuenta(2), {sort:1, foot:pie});
    if (soloSinCompra) table(document.getElementById('tCobVen'), [{t:'Vendedor',l:1},{t:'Sin compra',f:v=>N(v)},{t:'% de los pendientes',f:v=>PCT(v,0)}], listaVen, {sort:1, foot:['Total', cb.sin, 1]});
    else table(document.getElementById('tCobVen'), cols('Vendedor'), cobVen(), {sort:4, dir:1, foot:pie});
    const pend = cb.filas.filter(f => !f[5] && (!st.cobVen || vendsDe(f).includes(st.cobVen))).map(f => [f[0], CANAL_NOMBRE[f[1]]||f[1], f[2], f[3], f[4] ? f[4].split('-').reverse().join('/') : '']);
    table(document.getElementById('tCobPend'), [{t:'Cliente',l:1},{t:'Canal',l:1},{t:'Departamento',l:1},{t:'Vendedor',l:1},{t:'Alta',l:1}], pend, {sort:0, dir:1, search:'Buscar cliente'});
    const sel = document.getElementById('cobVen'); if (sel) { sel.value = st.cobVen||''; sel.onchange = () => { st.cobVen = sel.value; render(); }; }
  });
  const vs = (full, dia, nom) => dia!=null && !cb.filtrado ? `<div class="val">${SPCT(cb.comp/dia-1,0)}</div><div class="sub">Al mismo día de ${nom}: ${N(dia)} clientes</div>`
    : `<div class="val">${PCT(cb.comp/full,0)}</div><div class="sub">de los ${N(full)} clientes de ${nom} completo</div><div class="sub">Mes transcurrido ${PCT(HAB_TRANS/HAB.length,0)}</div>`;
  const sinMismoDia = COB.prevDia==null || COB.lyDia==null;
  return `<div class="vh"><div><h1>Clientes y cobertura · ${mcn} ${YR}</h1><p>La cartera activa son los clientes dados de alta, compren o no. Un cliente con compra cuenta una vez aunque compre varias unidades de negocio: su volumen neto del mes tiene que ser positivo.</p></div></div>
  <div class="grid k5">
   <div class="card kpi"><div class="lab">Cartera activa</div><div class="val">${N(cb.base)}</div><div class="sub">clientes dados de alta${cb.filtrado?' · con los filtros aplicados':''}</div></div>
   <div class="card kpi"><div class="lab">Con compra en ${mcn}</div><div class="val">${N(cb.comp)}</div><div class="sub">Cobertura <b style="color:var(--ink)">${PCT(cb.cob,1)}</b> de la cartera</div></div>
   <div class="card kpi"><div class="lab">Sin compra todavía</div><div class="val">${N(cb.sin)}</div><div class="sub">${PCT(1-cb.cob,1)} de la cartera</div></div>
   <div class="card kpi"><div class="lab">Contra ${cb.antNom}</div>${vs(cb.prevFull, COB.prevDia, cb.antNom)}</div>
   <div class="card kpi"><div class="lab">Contra ${mcn} ${YA}</div>${vs(cb.lyFull, COB.lyDia, `${mcn} ${YA}`)}</div>
  </div>
  <div class="grid g2">
   <div class="card"><h2>Clientes con compra por unidad de negocio <small>sobre la cartera activa · un cliente puede comprar varias</small></h2><div class="chart short"><canvas id="cCobUN" role="img" aria-label="Clientes con compra por unidad de negocio"></canvas></div>${st.ca>=0||st.de>=0?'<p class="note">Con filtro de canal o departamento se muestra solo el total.</p>':''}</div>
   <div class="card"><h2>Clientes con compra por mes <small>${YR} contra ${YA} · el mes en curso va a la fecha</small></h2><div class="legend"><span><i class="ln" style="background:var(--navy)"></i>${YR}</span><span><i class="dash" style="border-color:var(--c6)"></i>${YA}</span></div><div class="chart short"><canvas id="cCobMes"></canvas></div></div>
  </div>
  <div class="grid g2">
   <div class="card"><h2>Cobertura por canal</h2><div id="tCobCanal"></div></div>
   <div class="card"><h2>Cobertura por departamento</h2><div id="tCobDep"></div></div>
  </div>
  ${soloSinCompra ? `<div class="grid g21">
   <div class="card"><h2>Clientes activos sin compra en ${mcn} <small>la lista para salir a buscarlos</small></h2>
    <div class="cobsel"><label for="cobVen">Vendedor<select id="cobVen"><option value="">Todos</option>${ven.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></label></div>
    <div id="tCobPend"></div></div>
   <div class="card"><h2>${soloSinCompra?'Pendientes por vendedor':'Cobertura por vendedor <small>ordenado de menor a mayor cobertura</small>'}</h2><div id="tCobVen"></div>
    ${!soloSinCompra&&compartidos?`<p class="note">${N(compartidos)} clientes tienen dos vendedores y cuentan en la cartera de cada uno, por eso la suma de las carteras supera el total.</p>`:''}
    ${soloSinCompra?'<p class="note">La pestaña Clientes activos trae solo a los clientes sin compra, así que no se puede calcular la cobertura de cada vendedor. Si trae toda la cartera, también la de los que compraron, se agrega.</p>':''}</div>
  </div>` : `<div class="grid">
   <div class="card"><h2>${soloSinCompra?'Pendientes por vendedor':'Cobertura por vendedor <small>ordenado de menor a mayor cobertura</small>'}</h2><div id="tCobVen"></div>
    ${!soloSinCompra&&compartidos?`<p class="note">${N(compartidos)} clientes tienen dos vendedores y cuentan en la cartera de cada uno, por eso la suma de las carteras supera el total.</p>`:''}
    ${soloSinCompra?'<p class="note">La pestaña Clientes activos trae solo a los clientes sin compra, así que no se puede calcular la cobertura de cada vendedor. Si trae toda la cartera, también la de los que compraron, se agrega.</p>':''}</div>
   <div class="card"><h2>Clientes activos sin compra en ${mcn} <small>la lista para salir a buscarlos</small></h2>
    <div class="cobsel"><label for="cobVen">Vendedor<select id="cobVen"><option value="">Todos</option>${ven.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></label></div>
    <div id="tCobPend"></div></div>
  </div>`}
  ${sinMismoDia?`<p class="note">Las comparaciones contra ${cb.antNom} y contra ${mcn} ${YA} son contra el mes completo, porque la pestaña Compras por cliente trae solo ${mcn}. Si suma las compras de esos meses, el tablero compara al mismo día.</p>`:''}`;
};

V.resumen = () => {
  const d=fD(), p=fP(), hl=sum(d,6), fin=sum(d,7), r=rentab(p), ccc=uniq(d,1);
  const g=monthAgg(fM()), fac=HAB.length/HAB_TRANS;
  const oc=g(YR*100+MC), ol=g(YA*100+MC); let y6=[0,0], y5=[0,0]; for(let m=1;m<=CER;m++){ const a=g(YR*100+m), b=g(YA*100+m); y6[0]+=a[0]; y6[1]+=a[1]; y5[0]+=b[0]; y5[1]+=b[1]; }
  const full = st.d1===DIAS[0]&&st.d2===CORTE;
  return `<div class="vh"><div><h1>Resumen del mes · ${mcn} ${YR}</h1><p>Lo que hay que mirar hoy: ritmo contra objetivo, comparación interanual sin distorsión por mes incompleto y dónde se pierde margen.</p></div></div>
  <div class="grid k5">

    <div class="sub">Brecha de precio en esos días: <b style="color:var(--ink)">${MM(s.gap,1)}</b></div></div>`).join('')}</div>
  ${sets.map((s,i)=>`<div class="grid g21"><div class="card"><h2>$/HL ${s.n.toLowerCase()} por día <small>línea punteada: mínimo $${N(s.mn)} mil</small></h2><div class="chart short"><canvas id="cPd${i}"></canvas></div></div>
   <div class="card"><h2>${s.n} por canal</h2><div id="tPd${i}"></div></div></div>`).join('')}`;
};

V.preciomensual = () => {
  const sel = st.pm || MC;
  const rows=X.M.filter(r=>st.ca<0||r[3]===st.ca);
  const cut=(f)=>{ const m=grp(rows.filter(f),r=>r[0]*100+r[1],[4,5]); return k=>{const a=m.get(k);return a&&a[0]?a[1]/a[0]/1000:NaN}; };
  const G=cut(r=>st.un<0||r[2]===st.un), C=cut(r=>r[2]===0), U=cut(r=>r[2]===1), ms=[...Array(MC)].map((_,i)=>i+1);
  const card=(n,fn,cls)=>{const v=fn(YR*100+sel), ma=fn(YR*100+sel-1), aa=fn(YA*100+sel);
    return `<div class="card kpi ${cls}"><div class="lab">Precio neto / HL ${n}</div><div class="val">${N(v)}<small>mil</small></div><div class="sub">vs mes anterior ${chip(v/ma-1)}</div><div class="sub">vs ${MES[sel-1]} ${YA} ${chip(v/aa-1)}<span>nominal</span></div></div>`};
  const canals=[0,2,1,3];
  setTimeout(()=>{ const o=baseOpts();
    mk('cPm',{type:'line',data:{labels:ms.map(m=>MES[m-1]),datasets:[
      {label:'Cerveza',data:ms.map(m=>C(YR*100+m)),borderColor:css('--cer'),backgroundColor:css('--cer'),borderWidth:2,pointRadius:ms.map(m=>m===sel?6:3)},
      {label:'General',data:ms.map(m=>G(YR*100+m)),borderColor:css('--navy'),backgroundColor:css('--navy'),borderWidth:2,pointRadius:ms.map(m=>m===sel?6:3)},
      {label:'UNG',data:ms.map(m=>U(YR*100+m)),borderColor:css('--ung'),backgroundColor:css('--ung'),borderWidth:2,pointRadius:ms.map(m=>m===sel?6:3)},
      {label:'General '+YA,data:ms.map(m=>G(YA*100+m)),borderColor:css('--c6'),borderDash:[2,3],borderWidth:1.5,pointRadius:0}]},
      options:{...o,scales:{...o.scales,y:{...o.scales.y,ticks:{color:css('--muted'),callback:v=>'$'+N(v)},title:{display:true,text:'miles de $ por HL'}}},plugins:{...o.plugins,tooltip:{...o.plugins.tooltip,callbacks:{label:c=>`${c.dataset.label}: $${N(c.raw)} mil`}}}}});
    const cr=X.M.filter(r=>r[0]===YR); const cc=(ca,u,m)=>{let h=0,n=0;for(const r of cr){if(r[1]===m&&r[3]===ca&&(u<0?(st.un<0||r[2]===st.un):r[2]===u)){h+=r[4];n+=r[5]}}return h?n/h/1000:NaN};
    mk('cPmC',{type:'bar',data:{labels:canals.map(c=>CANAL_NOMBRE[CA[c]]),datasets:[['General',-1,'--navy'],['Cerveza',0,'--cer'],['UNG',1,'--ung']].map(([n,u,col])=>({label:n,data:canals.map(c=>cc(c,u,sel)),backgroundColor:css(col),borderRadius:3,maxBarThickness:30}))},
      options:{...o,interaction:{mode:'index',intersect:false},scales:{...o.scales,y:{...o.scales.y,ticks:{color:css('--muted'),callback:v=>'$'+N(v)}}},plugins:{...o.plugins,vl:{top:1,fmt:v=>N(v)},tooltip:{...o.plugins.tooltip,callbacks:{label:c=>{const ca=canals[c.dataIndex],u=[-1,0,1][c.datasetIndex];return `${c.dataset.label}: $${N(c.raw)} mil · ${SPCT(c.raw/cc(ca,u,sel-1)-1,0)} vs MA`}}}}}});
    const tb=document.getElementById('tPm'); const rws=canals.map(c=>{const r=[CANAL_NOMBRE[CA[c]]];for(const u of [-1,0,1]){const v=cc(c,u,sel);r.push(v,v/cc(c,u,sel-1)-1)}return r});
    table(tb,[{t:'Canal',l:1},{t:'General',f:v=>'$'+N(v)},{t:'vs MA',f:v=>SPCT(v,0),sign:1},{t:'Cerveza',f:v=>'$'+N(v)},{t:'vs MA',f:v=>SPCT(v,0),sign:1},{t:'UNG',f:v=>'$'+N(v)},{t:'vs MA',f:v=>SPCT(v,0),sign:1}],rws,{sort:0,dir:1});
  });
  setTimeout(()=>{ const s=document.getElementById('pmMes'); if(s){ s.value=sel; s.onchange=()=>{st.pm=+s.value; render();}; } });
  return `<div class="vh"><div><h1>Precio de venta por HL</h1><p>Valores netos en miles de pesos por HL. Se agrega la comparación contra el mismo mes de ${YA} para separar estacionalidad de aumento de precio.</p></div>
   <div class="filters" style="padding:0"><label for="pmMes">Mes<select id="pmMes">${[...Array(MC-1)].map((_,i)=>`<option value="${i+2}">${MESL[i+1]}</option>`).join('')}</select></label></div></div>
  <div class="grid g3">${card('general',G,'')}${card('cerveza',C,'cer')}${card('UNG',U,'ung')}</div>
  <div class="card"><h2>Evolución mensual ${YR} <small>punteado: general ${YA}</small></h2>
   <div class="legend"><span><i class="ln" style="background:var(--cer)"></i>Cerveza</span><span><i class="ln" style="background:var(--navy)"></i>General</span><span><i class="ln" style="background:var(--ung)"></i>UNG</span><span><i class="dash" style="border-color:var(--c6)"></i>General ${YA}</span></div>
   <div class="chart"><canvas id="cPm"></canvas></div></div>
  <div class="grid g2">
   <div class="card"><h2>$/HL por canal · ${MESL[sel-1]}</h2><div class="legend"><span><i style="background:var(--navy)"></i>General</span><span><i style="background:var(--cer)"></i>Cerveza</span><span><i style="background:var(--ung)"></i>UNG</span></div><div class="chart short"><canvas id="cPmC"></canvas></div></div>
   <div class="card"><h2>Variación contra el mes anterior por canal</h2><div id="tPm"></div><p class="note">Mismo dato que las tarjetas por canal del tablero original, en una sola tabla para comparar.</p></div>
  </div>`;
};

V.clientes = () => {
  const p=fP(), r=rentab(p);
  const cm=grp(p,r=>r[1],[6,7,8,9]), rows=rentRows(cm,k=>X.clis[k]);
  const neg=rows.filter(x=>x[7]<0);
  const srt=[...rows].sort((a,b)=>b[1]-a[1]); let acc=0,n80=0; const tot=r.ne; for(const x of srt){acc+=x[1]; n80++; if(acc>=tot*.8) break;}
  const top20=srt.slice(0,20).reduce((s,x)=>s+x[1],0)/tot;
  setTimeout(()=>{
    table(document.getElementById('tRc'),rentCols('Cliente'),rows,{sort:1,search:'Buscar cliente',foot:rentFoot(r)});
    table(document.getElementById('tRu'),rentCols('Unidad de negocio'),rentRows(grp(p,r=>r[4],[6,7,8,9]),k=>UN[k]),{sort:1,foot:rentFoot(r)});
    table(document.getElementById('tRca'),rentCols('Canal'),rentRows(grp(p,r=>r[3],[6,7,8,9]),k=>CA[k]),{sort:1,foot:rentFoot(r)});
    const o=baseOpts(), cut=t=>t.length>26?t.slice(0,25)+'…':t;
    const rank=(id,list,col)=>mk(id,{type:'bar',data:{labels:list.map(x=>cut(x[0])),datasets:[{data:list.map(x=>Math.abs(x[7])/1e6),backgroundColor:col,borderRadius:3,maxBarThickness:16}]},
      options:{...o,indexAxis:'y',interaction:{mode:'nearest',intersect:true,axis:'y'},layout:{padding:{right:96}},scales:{x:{display:false,beginAtZero:true},y:{grid:{display:false},border:{display:false},ticks:{color:css('--text'),font:{size:11},autoSkip:false}}},
        plugins:{...o.plugins,vl:{fmt:(v,i)=>`${list[i][7]<0?'−':''}${v<1?'$'+N(v*1000,0)+' mil':'$'+N(v,1)+' M'} · ${PCT(list[i][6],0)}`},
          tooltip:{...o.plugins.tooltip,callbacks:{title:it=>list[it[0].dataIndex][0],label:c=>{const x=list[c.dataIndex];return [`Resultado MG + TS: ${Math.abs(x[7])<1e6?(x[7]<0?'−':'')+'$'+N(Math.abs(x[7])/1000,0)+' mil':MM(x[7],2)} (${PCT(x[6],1)})`,`Venta neta ${MM(x[1],1)} · ${N(x[2],1)} HL`,`Margen bruto ${PCT(x[4],1)} · TS ${MM(x[5],2)}`]}}}}}});
    rank('cPos',[...rows].filter(x=>x[7]>0).sort((a,b)=>b[7]-a[7]).slice(0,20),css('--navy'));
    rank('cNeg',[...neg].sort((a,b)=>a[7]-b[7]).slice(0,20),css('--bad'));
  });
  return `<div class="vh"><div><h1>Rentabilidad comercial · clientes</h1><p>Margen bruto = venta neta − costo PNSF. Margen + TS suma el trade spend (acción centralizada, negociación y combos; excluye acción descentralizada) y se mide sobre neto + TS.</p></div></div>
  ${kpisRent(r)}
  <div class="grid g2">
   <div class="card"><h2>20 clientes que más aportan <small>resultado margen + TS en $ · etiqueta: $ y % MG + TS</small></h2><div class="chart" style="height:520px"><canvas id="cPos" role="img" aria-label="Ranking de los 20 clientes con mayor resultado positivo"></canvas></div></div>
   <div class="card"><h2>20 clientes que más restan <small>resultado margen + TS negativo, aun con trade spend · montos en miles</small></h2><div class="chart" style="height:520px"><canvas id="cNeg" role="img" aria-label="Ranking de los 20 clientes con mayor resultado negativo"></canvas></div></div>
  </div>
  <div class="card"><h2>Concentración y riesgo</h2><ul class="ins">
    <li><span class="sev info"></span><p><b>${N(rows.length)} clientes</b> con venta en el período. Los 20 primeros explican <b>${PCT(top20,0)}</b> de la venta neta y hacen falta <b>${N(n80)}</b> para llegar al 80%.</p></li>
    <li><span class="sev bad"></span><p><b>${N(neg.length)} clientes</b> tienen margen + TS negativo. Su resultado conjunto es <b>${MM(neg.reduce((s,x)=>s+x[7],0),1)}</b>; los 20 del ranking explican <b>${PCT([...neg].sort((a,b)=>a[7]-b[7]).slice(0,20).reduce((s,x)=>s+x[7],0)/neg.reduce((s,x)=>s+x[7],0),0)}</b> de esa pérdida.</p></li>
    <li><span class="sev warn"></span><p><b>${N(rows.filter(x=>x[8]<0).length)} clientes</b> tienen margen bruto negativo antes del TS: el precio neto no cubre el PNSF.</p></li>
   </ul></div>
  <div class="card"><h2>Clientes por venta neta <small>$ en millones · ordená por cualquier columna</small></h2><div id="tRc"></div></div>
  <div class="card"><h2>Rentabilidad por unidad de negocio</h2><div id="tRu"></div></div><div class="card"><h2>Rentabilidad por canal</h2><div id="tRca"></div></div>`;
};
function kpisRent(r){ return `<div class="grid k5">
   <div class="card kpi"><div class="lab">Venta neta</div><div class="val">${N(r.ne/1e6)}<small>M</small></div><div class="sub">${PH(r.ph)} por HL</div></div>
   <div class="card kpi"><div class="lab">Margen bruto</div><div class="val" style="color:${r.mb<0?'var(--bad)':'var(--ink)'}">${N(r.mb/1e6,1)}<small>M</small></div><div class="sub">${chip(r.pmb)} sobre venta neta</div></div>
   <div class="card kpi"><div class="lab">PNSF / venta</div><div class="val">${PCT(r.ppn,1)}</div><div class="sub">Costo ${MM(r.pn,0)}</div></div>
   <div class="card kpi"><div class="lab">Trade spend</div><div class="val">${N(r.ts/1e6,1)}<small>M</small></div><div class="sub">${PCT(r.ts/r.ne,1)} de la venta neta</div></div>
   <div class="card kpi"><div class="lab">Margen + TS</div><div class="val" style="color:${r.mts<0?'var(--bad)':'var(--ink)'}">${PCT(r.pmts,1)}</div><div class="sub">${MM(r.mts,1)}</div></div></div>`; }

V.productos = () => {
  const p=fP(), r=rentab(p);
  const pm=grp(p,r=>r[2],[6,7,8,9]), rows=rentRows(pm,k=>X.prods[k]);
  const worst=rows.map(x=>[x[0],x[7],x[2],x[6]]).filter(x=>x[1]<0).sort((a,b)=>a[1]-b[1]);
  setTimeout(()=>{
    table(document.getElementById('tPr'),rentCols('Producto'),rows,{sort:2,search:'Buscar producto',foot:rentFoot(r)});
    table(document.getElementById('tPca'),rentCols('Canal'),rentRows(grp(p,r=>r[3],[6,7,8,9]),k=>CA[k]),{sort:1,foot:rentFoot(r)});
    table(document.getElementById('tPw'),[{t:'Producto',l:1},{t:'Resultado MG + TS',f:v=>MM(v,2),sign:1},{t:'HL',f:v=>N(v,1)},{t:'% MG + TS',f:v=>PCT(v,0),sign:1}],worst,{sort:1,dir:1,foot:['Total',worst.reduce((s,x)=>s+x[1],0),worst.reduce((s,x)=>s+x[2],0),null]});
    const o=baseOpts(); const steps=[['Venta neta',0,r.ne,'--navy'],['+ Trade spend',r.ne,r.ne+r.ts,'--good'],['− Costo PNSF',r.ne+r.ts,r.mts,'--bad'],['Margen + TS',0,r.mts,'--acc']];
    mk('cWf',{type:'bar',data:{labels:steps.map(s=>s[0]),datasets:[{data:steps.map(s=>[s[1]/1e6,s[2]/1e6]),backgroundColor:steps.map(s=>css(s[3])),borderRadius:3,maxBarThickness:70}]},
      options:{...o,interaction:{mode:'nearest',intersect:true},scales:{...o.scales,y:{...o.scales.y,ticks:{color:css('--muted'),callback:v=>'$'+N(v)},title:{display:true,text:'$ M'}}},
       plugins:{...o.plugins,vl:{fmt:(v,i)=>{const d=(v[1]-v[0]);return (i===2?'−':'')+'$'+N(Math.abs(d),0)+' M'}},tooltip:{...o.plugins.tooltip,callbacks:{label:c=>`$${N(Math.abs(c.raw[1]-c.raw[0]),1)} M`}}}}});
  });
  return `<div class="vh"><div><h1>Rentabilidad comercial · productos</h1><p>Mismo criterio de margen que la vista de clientes, abierto por SKU. El puente muestra cómo el trade spend compensa un costo PNSF mayor que la venta neta.</p></div></div>
  ${kpisRent(r)}
  <div class="grid g2">
   <div class="card"><h2>Puente de margen <small>millones de pesos</small></h2><div class="chart"><canvas id="cWf"></canvas></div></div>
   <div class="card"><h2>Productos con resultado negativo <small>${worst.length} SKU · aun con TS</small></h2><div id="tPw"></div></div>
  </div>
  <div class="card"><h2>Productos por HL <small>$ en millones</small></h2><div id="tPr"></div></div>
  <div class="card"><h2>Rentabilidad por canal</h2><div id="tPca"></div></div>`;
};

/* ---------- navegación ---------- */
function render(){
  killCharts();
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+st.view?'page':'false'));
  const mainEl=document.getElementById('main'); mainEl.innerHTML = `<section class="view">${V[st.view]()}</section>`;
}
function fromHash(){ const h=location.hash.slice(1); st.view = V[h]? h : 'ejecutivo'; try{localStorage.setItem('zuppa-view',st.view)}catch(e){} render(); }
document.querySelectorAll('#tabs a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const v=a.getAttribute('href').slice(1); history.replaceState(null,'','#'+v); st.view=v; try{localStorage.setItem('zuppa-view',v)}catch(_){} render(); window.scrollTo(0,0); }));
window.addEventListener('hashchange',fromHash);
if(!location.hash){ try{ const v=localStorage.getItem('zuppa-view'); if(v&&V[v]) st.view=v; }catch(e){} }
else st.view = V[location.hash.slice(1)]? location.hash.slice(1) : 'ejecutivo';
render();
</script>

</body>
</html>
